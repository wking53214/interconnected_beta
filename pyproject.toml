[project]
name = "beta"
version = "0.1.0"
description = "Lock states + Keys -> a governed Decision with narrative (reasoning, reversals, instructions)."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "zeta @ git+https://github.com/wking53214/interconnected_zeta",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["beta"]
